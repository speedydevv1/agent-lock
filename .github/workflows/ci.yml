name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: pywinpty, so the menu test drives a real ConPTY
        if: runner.os == 'Windows'
        run: pip install "pywinpty==2.0.15"
      - run: npm test

  # The images one release behind. Windows Server 2022 keeps the older managed-settings layout
  # and ships PowerShell 5.1 as the default shell, which is where the shims have to work too.
  previous-images:
    name: test (node 22, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: pywinpty, so the menu test drives a real ConPTY
        if: runner.os == 'Windows'
        run: pip install "pywinpty==2.0.15"
      - run: npm test

  # musl, not glibc: the libc every devcontainer and CI image built on Alpine actually uses.
  # coreutils gives GNU stty, so the arrow menu is exercised here; the busybox stty that Alpine
  # ships by default has no -g, and the fallback menu that case drops to has its own test.
  musl:
    name: test (node 22, alpine/musl)
    runs-on: ubuntu-latest
    container: node:22-alpine
    steps:
      - run: apk add --no-cache git python3 coreutils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm test

  # The parts that only exist on Windows and that no unit test can reach: the shims as installed,
  # found by every shell the machine ships, and the policy value in HKCU. It writes the user PATH
  # and a registry key, so it only ever runs on a throwaway runner.
  windows-install:
    name: install round trip (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node test/windows-install.mjs

  lint:
    name: format, lint, checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run check
      - name: SHA256SUMS matches the tree
        run: shasum -a 256 -c SHA256SUMS

  secrets:
    name: secrets (all history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan history without printing secret values
        run: gitleaks git . --log-opts="--all --full-history" --redact
